version: "3.8"

services:
  # 1. Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recruitbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: recruitbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RecruitBook Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitbook-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Connects directly to the postgres service container inside the docker network
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/recruitbook
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: recruitbook_pgdata
    driver: local
